<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Blog de Wellyngton Souza">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/simplemde/latest/simplemde.min.css">
    <link rel="stylesheet" href="./assets/css/style.css">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">

    <title>Blog de Wellyoza</title>
</head>

<body>
    <div id="app">
        <header class="header">
            <div class="container">
                <router-link class="header__greetings" to="/">Blog</router-link>

                <nav class="header__nav">
                    <a href="https://www.instagram.com/wellyngtoonsouza/" rel="noreferrer noopener" target="_blank">
                        <i class="bi bi-instagram"></i>
                    </a>
                    <a href="https://x.com/well4551" rel="noreferrer noopener" target="_blank">
                        <i class="bi bi-twitter-x"></i>
                    </a>
                    <a href="https://www.youtube.com/@Wellyoza" rel="noreferrer noopener" target="_blank">
                        <i class="bi bi-youtube"></i>
                    </a>
                </nav>
            </div>
        </header>

        <main>
            <div class="container">
                <router-view></router-view>
            </div>
        </main>

        <footer class="footer">
            <p>&copy; Desenvolvido por <a href="https://lezzin.github.io" target="_blank">Leandro Adrian</a> - 2024</p>
        </footer>

        <aside :class="['toast', toast.opened && 'active']">
            <span
                :class="['toast__banner', toast.status == 'danger' ? 'toast__banner--danger' : 'toast__banner--success']"></span>
            <p class="toast__message"><i class="bi bi-exclamation-circle"></i> {{ toast.message }}</p>
        </aside>
    </div>

    <template id="home-template">
        <div>
            <div class="presentation">
                <h2 class="presentation__title">Olá, sou Wellyngton Souza 👋</h2>
                <div class="presentation__texts">
                    <p>
                        Aqui, você encontrará conteúdos acadêmicos de qualidade, dicas, tutoriais e discussões que vão
                        ajudar a aprofundar seus conhecimentos e a desenvolver habilidades essenciais para sua carreira.
                        Vamos juntos nessa jornada de aprendizado!
                    </p>
                </div>
            </div>

            <div class="loader" v-if="loadingPosts">
                <span class="loader__spinner"></span>
            </div>

            <div v-else>
                <nav class="preview" v-if="posts.length > 0">
                    <router-link v-for="post in posts" class="post post--hover" :to="'post/' + post.id">
                        <h2 class="post__title">{{ post.title }}</h2>
                        <p class="post__description">{{ post.description }}</p>
                        <p class="post__date">Publicado em: {{ post.created_at }}</p>
                    </router-link>
                </nav>
                <p class="alert" v-else>
                    Oops! Ainda não há nenhuma postagem. Volte mais tarde.
                </p>
            </div>
        </div>
    </template>

    <template id="post-template">
        <div class="loader" v-if="loadingPost">
            <span class="loader__spinner"></span>
        </div>
        <section class="view" v-else>
            <div class="view__header">
                <h2 class="view__title">{{ post.title }} </h2>

                <div class="view__header__footer">
                    <p class="view__date">Publicado em: {{ post.created_at }}</p>
                    <a href="javascript:history.back()" class="btn btn--back"><i class="bi bi-arrow-left"></i>
                        Voltar</a>
                </div>
            </div>

            <div class="view__content" v-html="renderMarkdown(post.content)"></div>

            <div class="view__footer">
                <h4 class="view__footer__title">Gostou do conteúdo?</h4>

                <div class="view__footer__content">
                    <p>Me siga em minhas redes sociais e compartilhe com seus amigos!</p>

                    <div class="btn-group">
                        <a href="https://www.instagram.com/wellyngtoonsouza/" rel="noreferrer noopener" target="_blank"
                            class="btn btn--out-primary" role="button">
                            <i class="bi bi-instagram"></i>
                        </a>
                        <a href="https://x.com/well4551" rel="noreferrer noopener" target="_blank"
                            class="btn btn--out-primary" role="button">
                            <i class="bi bi-twitter-x"></i>
                        </a>
                        <a href="https://www.youtube.com/@Wellyoza" rel="noreferrer noopener" target="_blank"
                            class="btn btn--out-primary" role="button">
                            <i class="bi bi-youtube"></i>
                        </a>
                        <button type="button" class="btn btn--primary" @click="share" title="Compartilhar postagem">
                            <i class="bi bi-share"></i> Compartilhar
                        </button>
                    </div>
                </div>
            </div>
        </section>
    </template>

    <template id="admin-template">
        <div class="admin">
            <div v-if="user.loggedIn">
                <header class="admin__header">
                    <h2 class="admin__title">Administração</h2>

                    <div class="admin__buttons">
                        <button type="button" class="btn btn--out-success" title="Alterar senha"
                            @click="changePassword">
                            <i class="bi bi-lock"></i> Alterar senha
                        </button>

                        <button type="button" class="btn btn--danger" title="Sair da conta" @click="logout">
                            <i class="bi bi-box-arrow-left"></i> Sair
                        </button>
                    </div>
                </header>

                <button type="button" class="btn btn--success --left" title="Adicionar nova postagem"
                    @click="openAddModal">
                    <i class="bi bi-plus"></i> Nova postagem
                </button>

                <div class="loader" v-if="loadingPosts">
                    <span class="loader__spinner"></span>
                </div>
                <div v-else>
                    <div class="preview" v-if="posts.length > 0">
                        <section v-for="post in posts" :key="post.id" class="post">
                            <h2 class="post__title">{{ post.title }}</h2>
                            <p class="post__description">{{ post.description }}</p>

                            <div class="post__buttons">
                                <router-link :to="'post/' + post.id" class="btn btn--success" role="button">
                                    <i class="bi bi-eye"></i> Visualizar
                                </router-link>
                                <button type="button" class="btn btn--out-success" title="Editar postagem"
                                    @click="openEditModal(post)">
                                    <i class="bi bi-pencil"></i> Editar
                                </button>
                                <button type="button" class="btn btn--out-danger" title="Excluir postagem"
                                    @click="deletePost(post)">
                                    <i class="bi bi-trash"></i> Excluir
                                </button>
                            </div>
                        </section>
                    </div>
                    <p class="alert" v-else>
                        Nenhuma postagem encontrada.
                    </p>
                </div>
            </div>

            <aside :class="['modal', !user.loggedIn && 'active']">
                <div class="modal__dialog">
                    <h3 class="modal__title">Fazer login</h3>

                    <div class="modal__body">
                        <form class="form" @submit.prevent="login">
                            <div class="form__group">
                                <label for="email">Email</label>
                                <input type="email" id="email" v-model="user.email" placeholder="email@gmail.com"
                                    required>
                            </div>

                            <div class="form__group">
                                <label for="password">Senha</label>
                                <input type="password" id="password" v-model="user.password" placeholder="******"
                                    required>
                            </div>

                            <div class="form__footer">
                                <button type="submit" class="btn btn--success">Entrar</button>
                            </div>
                        </form>
                    </div>
                </div>
            </aside>

            <aside :class="['modal', modalAddOpened && 'active']">
                <div class="modal__dialog">
                    <h3 class="modal__title">Adicionar nova postagem</h3>

                    <div class="modal__body">
                        <form class="form" @submit.prevent="addPost">
                            <div class="form__group">
                                <label for="add-title">Título</label>
                                <input type="text" id="add-title" v-model="addingPost.title"
                                    placeholder="Título da postagem" required autocomplete="off">
                            </div>

                            <div class="form__group">
                                <label for="add-description">Descrição</label>
                                <input type="text" id="add-description" v-model="addingPost.description"
                                    placeholder="Descrição da postagem" required autocomplete="off">
                            </div>

                            <div class="form__group">
                                <label for="add-content">Conteúdo (Markdown permitido)</label>
                                <span class="form__helper">
                                    Para adicionar uma imagem, arraste-a para a área abaixo. <br>
                                    Para URL's do Youtube, o vídeo será exibido em um iframe.
                                </span>
                                <textarea id="add-content" placeholder="Conteúdo da postagem"></textarea>
                            </div>

                            <div class="form__footer">
                                <button type="submit" class="btn btn--success">
                                    <i class="bi bi-check-lg"></i>
                                    Adicionar
                                </button>
                                <button type="button" class="btn btn--out-danger" title="Fechar modal"
                                    @click="closeAddModal">
                                    <i class="bi bi-x"></i>
                                    Cancelar
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </aside>

            <aside :class="['modal', modalEditOpened && 'active']">
                <div class="modal__dialog">
                    <h3 class="modal__title">Editar postagem</h3>

                    <div class="modal__body">
                        <form class="form" @submit.prevent="editPost">
                            <div class="form__group">
                                <label for="edit-title">Título</label>
                                <input type="text" id="edit-title" v-model="editingPost.title"
                                    placeholder="Título da postagem" required autocomplete="off">
                            </div>

                            <div class="form__group">
                                <label for="edit-description">Descrição</label>
                                <input type="text" id="edit-description" v-model="editingPost.description"
                                    placeholder="Descrição da postagem" required autocomplete="off">
                            </div>

                            <div class="form__group">
                                <label for="edit-content">Conteúdo (Markdown permitido)</label>
                                <span class="form__helper">
                                    Para adicionar uma imagem, arraste-a para a área abaixo. <br>
                                    Para URL's do Youtube, o vídeo será exibido em um iframe.
                                </span>
                                <textarea id="edit-content" v-model="editingPost.content"
                                    placeholder="Conteúdo da postagem"></textarea>
                            </div>

                            <div class="form__footer">
                                <button type="submit" class="btn btn--success">
                                    <i class="bi bi-check-lg"></i>
                                    Confirmar edição
                                </button>
                                <button type="button" class="btn btn--out-danger" title="Fechar modal"
                                    @click="closeEditModal">
                                    <i class="bi bi-x"></i>
                                    Cancelar
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </aside>
        </div>
    </template>

    <template id="not-found-template">
        <div class="not-found">
            <h1 class="not-found__title">Oops!</h1>
            <p class="not-found__text">404: Página não encontrada</p>
            <router-link to="/" class="not-found__link">Voltar para o início</router-link>
        </div>
    </template>

    <script src="https://cdn.jsdelivr.net/npm/vue@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/vue-router@3"></script>
    <script type="module" src="./assets/js/App.js"></script>
</body>

</html>
